services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mikrotik-app
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - shared

  # Background worker scheduler MikroTik
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mikrotik-scheduler
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app
    networks:
      - shared

networks:
  shared:
    external: true
