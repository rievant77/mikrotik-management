services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mikrotik-management:latest
    container_name: mikrotik_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9000}:80"
    environment:
      - APP_NAME=${APP_NAME:-MikroTik Manager}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:9000}
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      - DB_DATABASE=${DB_DATABASE:-/var/www/html/database/database.sqlite}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - CACHE_STORE=${CACHE_STORE:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
    volumes:
      # Persistent SQLite database file (used if DB_CONNECTION=sqlite)
      - ./database:/var/www/html/database
      # Persistent logs and session data
      - ./storage:/var/www/html/storage
      # Persistent uploaded avatars & branding logos
      - ./public/uploads:/var/www/html/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fL http://localhost/login || curl -fL http://localhost/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s


